<!DOCTYPE html>
<html lang="es-EC">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2207F">
<meta name="app-version" content="2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPARATI Prueba">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Inventario de SPARATI: productos para vender y de uso en el spa">
<title>SPARATI Prueba</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="franja-prueba">Versión de prueba · los datos no son los reales</div>
<main id="app"></main>
<nav class="nav" aria-label="Principal"></nav>
<div id="capas"></div>
<div id="anuncio" class="solo-lectura" role="status"></div>
<input type="file" id="inFoto" accept="image/*" hidden>
<input type="file" id="inArchivo" accept=".txt,.json,text/plain,application/json" hidden>
<script src="app.js?v=2.5"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(r=>{
      const revisar = ()=>{ const sw = r.active || navigator.serviceWorker.controller; if(sw && navigator.onLine) sw.postMessage('revisar'); };
      if(r.active) revisar(); else navigator.serviceWorker.ready.then(revisar);
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
