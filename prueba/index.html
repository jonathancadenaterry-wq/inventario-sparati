<!DOCTYPE html>
<html lang="es-EC">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2207F">
<meta name="app-version" content="2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPARATI Prueba">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Inventario de SPARATI: productos para vender y de uso en el spa">
<title>SPARATI Prueba</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<style>
@font-face{font-family:Inter;src:url('fuentes/inter-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url('fuentes/inter-latin-600-normal.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Inter;src:url('fuentes/inter-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Playfair Display';src:url('fuentes/playfair-display-latin-600-normal.woff2') format('woff2');font-weight:600;font-display:swap}
/* Una columna para celular: navegación abajo, pantallas que se abren encima para registrar y editar */
:root{
  --bg:#F9F6F7; --surface:#FFFFFF; --ink:#2A1F27; --muted:#6B6169; --line:#ECE4E0;
  --accent:#C2207F; --accent-fill:#C2207F; --accent-soft:#FBE7F2; --on-accent:#FFFFFF; --gold:#356D57; --gold-soft:#E7F3ED;
  --ok:#2F7A57; --ok-soft:#E3F2EA; --warn:#9A5A10; --warn-soft:#FBF0DF; --bad:#A8364A; --bad-fill:#A8364A; --bad-soft:#F9E5E8;
  --font-brand:'Playfair Display', Georgia, serif;
  --font-body:'Inter', system-ui, sans-serif;
  --nav-h:66px; --sombra:0 1px 2px rgba(60,30,50,.05), 0 4px 14px rgba(60,30,50,.05);
  --franja:calc(env(safe-area-inset-top, 0px) + 24px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17121A; --surface:#221B25; --ink:#F3ECF0; --muted:#B9AAB4; --line:#342A36;
    --accent:#E77DB8; --accent-soft:#3F1C35; --gold:#BFE3D2; --gold-soft:#344043;
    --ok:#9DD5B9; --ok-soft:#243631; --warn:#E8B260; --warn-soft:#382F21; --bad:#F2A0B0; --bad-soft:#3A202C;
    --sombra:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17121A; --surface:#221B25; --ink:#F3ECF0; --muted:#B9AAB4; --line:#342A36;
  --accent:#E77DB8; --accent-soft:#3F1C35; --gold:#BFE3D2; --gold-soft:#344043;
  --ok:#9DD5B9; --ok-soft:#243631; --warn:#E8B260; --warn-soft:#382F21; --bad:#F2A0B0; --bad-soft:#3A202C;
  --sombra:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body.bloqueo{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-width:44px;min-height:44px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.peq{font-size:.82rem}
[hidden]{display:none!important}

.franja-prueba{position:fixed;inset:0 0 auto;z-index:110;padding:calc(env(safe-area-inset-top, 0px) + 4px) 8px 4px;background:var(--accent-fill);color:var(--on-accent);font-size:.75rem;font-weight:700;line-height:16px;text-align:center}
#app{max-width:600px;margin:0 auto;padding:calc(var(--franja) + 14px) 16px calc(env(safe-area-inset-bottom) + var(--nav-h) + 96px);display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca-inicio{display:flex;align-items:center;gap:12px}
.marca-inicio .emblema{width:58px;height:auto}
.marca-inicio .logo-texto{height:13px;width:auto;display:block}
.top h1{font-family:var(--font-brand);font-weight:600;font-size:1.85rem;margin:0;line-height:1.05;letter-spacing:.01em}
.top .sub{font-size:.85rem;color:var(--muted);margin-top:3px}
.top .sub::first-letter{text-transform:uppercase}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;width:46px;height:46px;display:grid;place-items:center;flex:none;position:relative}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sombra)}
.card h3{margin:0;font-family:var(--font-brand);font-size:1.15rem;font-weight:600;line-height:1.25}
.card-cab{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-tit{font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 4px -4px}

.aviso{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.aviso .fila{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:none;border-radius:16px;padding:12px 16px;font-weight:700;background:var(--accent-fill);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.gold{background:var(--gold-soft);color:var(--gold)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:8px 12px;min-height:44px;font-size:.86rem;border-radius:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.link{background:none;border:none;color:var(--accent);font-weight:700;padding:6px 2px;font-size:.9rem}

/* Estado general */
.estado-ok{display:flex;align-items:center;gap:12px;background:var(--ok-soft);color:var(--ok);border-radius:18px;padding:16px;font-weight:700}
.estado-ok span{font-size:1.6rem}
.cifras{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cifra{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sombra);text-align:left}
.cifra .v{font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.cifra .l{font-size:.78rem;color:var(--muted);font-weight:600}
.cifra.ancha{grid-column:1/-1}

/* Filas de alerta */
.alerta{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left}
.alerta:first-of-type{border-top:none}
.alerta .tx{flex:1;min-width:0}
.alerta b{display:block;font-size:.96rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alerta .d{font-size:.82rem;color:var(--muted)}
.alerta .d .warn{color:var(--warn);font-weight:700}.alerta .d .bad{color:var(--bad);font-weight:700}
.alerta .chev{color:var(--muted);font-size:1.4rem;line-height:1;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}

/* Avatar de producto */
.av{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font:600 1rem var(--font-brand);color:var(--gold);overflow:hidden;background:var(--gold-soft)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:38px;height:38px;border-radius:11px;font-size:.85rem}
.av.xl{width:96px;height:96px;border-radius:24px;font-size:1.8rem}

/* Lista de productos */
.buscar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 12px}
.buscar svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.buscar:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.buscar input,.buscar input[type=search]{border:none;background:none;outline:none;padding:13px 0;width:100%;font-size:1rem;min-width:0;border-radius:0}
.buscar input::placeholder{color:var(--muted);opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px 14px;font-size:.88rem;font-weight:600;white-space:nowrap;flex:none}
.chip.on{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.chip .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad-fill);color:#fff;font-size:.72rem;font-weight:800;line-height:18px;text-align:center}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sombra);overflow:hidden}
.prod-main{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:none;text-align:left}
.prod-main .tx{flex:1;min-width:0}
.prod-main b{display:block;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-main .m{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-main .pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.stock{text-align:right;flex:none}
.stock .q{font-size:1.35rem;font-weight:800;line-height:1.1}
.stock .u{font-size:.74rem;color:var(--muted);font-weight:600}
.stock.bad .q{color:var(--bad)} .stock.warn .q{color:var(--warn)}
.prod-acc{display:flex;border-top:1px solid var(--line)}
.prod-acc button{flex:1;background:none;border:none;padding:11px 6px;font-weight:700;font-size:.86rem;color:var(--accent)}
.prod-acc button+button{border-left:1px solid var(--line)}
.vacio{text-align:center;color:var(--muted);padding:30px 18px;font-size:.95rem;display:flex;flex-direction:column;gap:12px;align-items:center}

/* Botón flotante */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + var(--nav-h) + 14px);z-index:20;box-shadow:0 8px 24px rgba(80,30,65,.28);border-radius:30px;padding:14px 22px;font-size:1rem;width:min(calc(100% - 32px), 568px)}

/* Navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted);position:relative}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent)}
.nav .punto{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad-fill);color:#fff;font-size:.68rem;font-weight:800;line-height:18px;text-align:center}

/* Ventas */
.mes{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px}
.mes b{font-weight:800}
.mes b::first-letter{text-transform:uppercase}
.mes button{width:42px;height:42px;border-radius:12px;border:none;background:var(--accent-soft);color:var(--accent);font-size:1.2rem;font-weight:800}
.mes button:disabled{opacity:.35}
.dia-tit{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:6px 4px 0}
.dia-tit::first-letter{text-transform:uppercase}
.venta{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;box-shadow:var(--sombra)}
.venta .c{display:flex;justify-content:space-between;align-items:center;gap:8px}
.venta .pac{font-weight:800}
.venta .tot{font-weight:800}
.venta .it{font-size:.85rem;color:var(--muted)}
.top-prod{display:flex;align-items:center;gap:10px;font-size:.9rem;padding:6px 0;border-top:1px solid var(--line)}
.top-prod:first-of-type{border-top:none}
.top-prod .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-prod .b{height:6px;border-radius:4px;background:var(--gold);flex:none}

/* Hojas */
.hoja{position:fixed;inset:var(--franja) 0 0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:sube .18s ease-out}
@keyframes sube{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.hoja{animation:none}}
.hoja-cab{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.hoja-cab h2{font-family:var(--font-brand);font-size:1.2rem;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hoja-cuerpo{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hoja-in{max-width:600px;margin:0 auto;padding:16px 16px 30px;display:flex;flex-direction:column;gap:14px}
.hoja-pie{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px)}
.hoja-pie .in{max-width:600px;margin:0 auto;display:flex;gap:10px}
.hoja-pie .btn{flex:1}

/* Detalle */
.det-cab{display:flex;gap:14px;align-items:center}
.det-cab h3{margin:0;font-size:1.25rem;font-weight:800;line-height:1.2}
.det-stock{display:flex;align-items:baseline;gap:8px;justify-content:center;padding:6px 0}
.det-stock .q{font-size:2.6rem;font-weight:800;line-height:1}
.det-stock .u{color:var(--muted);font-weight:700}
.acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dato{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.dato:first-of-type{border-top:none}
.dato span:first-child{color:var(--muted)}
.dato span:last-child{font-weight:700;text-align:right;overflow-wrap:anywhere}
.mov{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:.88rem}
.mov:first-of-type{border-top:none}
.mov .q{font-weight:800;text-align:right}
.mov .q.mas{color:var(--ok)} .mov .q.menos{color:var(--bad)}
.mov .s{grid-column:1/-1;color:var(--muted);font-size:.8rem}

/* Formularios */
.campo{display:flex;flex-direction:column;gap:6px}
.campo>label,.campo>.lbl{font-size:.84rem;font-weight:700;color:var(--muted)}
.campo .ayuda{font-size:.78rem;color:var(--muted)}
input[type=text],input[type=date],input[type=tel],input[type=search],input[inputmode],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-size:1rem;min-width:0}
textarea{min-height:76px;resize:vertical}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fila2>*{min-width:0}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:10px 6px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button.on{background:var(--accent-fill);color:var(--on-accent)}
.paso{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.paso button{width:52px;height:50px;border:none;background:var(--accent-soft);color:var(--accent);font-size:1.4rem;font-weight:800;flex:none}
.paso input{border:none!important;border-radius:0!important;text-align:center;font-weight:800;font-size:1.15rem}
.foto-campo{display:flex;align-items:center;gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:.92rem}
.check input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--accent)}
.item-venta{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.item-venta .n{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item-venta .x{border:none;background:none;color:var(--bad);font-size:1.2rem;width:36px;height:36px}
.item-venta .ctl{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item-venta .sub{grid-column:1/-1;font-size:.84rem;color:var(--muted);text-align:right}
.total{display:flex;justify-content:space-between;align-items:center;font-size:1.15rem;font-weight:800;padding:4px 2px}
.selector{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.sel-item{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.sel-item .tx{flex:1;min-width:0}
.sel-item b{display:block;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + var(--nav-h) + 84px);background:var(--ink);color:var(--bg);padding:11px 14px 11px 16px;border-radius:14px;font-size:.92rem;font-weight:600;z-index:100;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px}
.toast button{background:none;border:none;color:var(--gold);font-weight:800;padding:4px 2px;white-space:nowrap}
.dlg-fondo{position:fixed;inset:0;z-index:90;background:rgba(30,15,25,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:22px;padding:20px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom)}
.dlg h3{margin:0;font-size:1.1rem}
.dlg p{margin:0;font-size:.95rem}
.dlg .fila{display:flex;gap:10px}
.dlg .fila .btn{flex:1}
.bienvenida{align-items:center;text-align:center;gap:18px;padding-top:40px}
.bienvenida .logo-completo{width:min(100%, 240px);height:auto}
.bienvenida .rotulo{font-size:.8rem;letter-spacing:.2em;font-weight:700;color:var(--gold)}
.bienvenida h1{font-family:var(--font-brand);font-size:1.5rem;font-weight:600;margin:4px 0 0}
.quien{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.quien button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:22px 10px;font-weight:800;font-size:1.05rem;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:var(--sombra)}
</style>
</head>
<body>
<div class="franja-prueba">Versión de prueba · los datos no son los reales</div>
<main id="app" aria-live="polite"></main>
<button class="btn fab" id="fab" data-act="fab" hidden></button>
<nav class="nav" aria-label="Secciones">
  <div class="nav-in">
    <button data-act="tab" data-tab="inicio" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Inicio<span class="punto" id="nInicio" hidden></span></button>
    <button data-act="tab" data-tab="venta"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 016 0"/></svg>Para vender<span class="punto" id="nVenta" hidden></span></button>
    <button data-act="tab" data-tab="uso"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v5l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/><path d="M7.5 14h9"/></svg>Uso en spa<span class="punto" id="nUso" hidden></span></button>
